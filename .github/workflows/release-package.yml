name: Build install packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        default: dev
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build auditable source packages
        run: python3 scripts/package_release.py --version "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: personal-digital-assistant-${{ steps.version.outputs.value }}
          path: dist/*
      - name: Attach packages to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
